<div class="form-container">
  <form [formGroup]="ideaForm" (ngSubmit)="onSubmit()">
    <mat-card>
      <mat-card-header>
        <mat-card-title class="card-title">Create New Idea</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput placeholder="Enter title" formControlName="title" />
          @if(ideaForm.get('title')?.hasError('required')) {
          <mat-error>Title is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea
            matInput
            placeholder="Enter description"
            formControlName="description"
          ></textarea>
          @if(ideaForm.get('description')?.hasError('required')) {
          <mat-error>Description is required</mat-error>
          }
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button routerLink="/" type="button">Cancel</button>

        <button
          mat-flat-button
          color="primary"
          [disabled]="ideaForm.invalid"
          type="submit"
        >
          Save
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
